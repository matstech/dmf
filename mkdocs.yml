site_name: DMF 
site_description: Deterministic Memory Framework

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: true
            show_source: true

nav:
  - Home: index.md
  - API Reference:
      - APIs: api/public.md
      - Internals: api/internals.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
