[project]
name = "dmf"
# $versifyr:template={{ (printf "version = \"%s\"" .version) }}$
version = "0.1.0"
description = "Deterministic Memory Framework"
authors = [{ name = "matstech", email = "matteo.stabile2@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "spacy (>=3.8.11,<4.0.0)",
    "vadersentiment (>=3.3.2,<4.0.0)",
    "fastembed (>=0.7.4,<0.8.0)",
    "chromadb (>=0.6.0,<0.7.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "pydantic (>=2.12.0,<3.0.0)",
]


[tool.poetry]
packages = [{ include = "dmf" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest (>=9.0.2,<10.0.0)", "pytest-asyncio (>=1.3.0,<2.0.0)"]
docs = ["mkdocs-material (>=9.5.0,<10.0.0)", "mkdocstrings[python] (>=0.28.0,<1.0.0)"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]
